name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Show deployment context
        run: |
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "base_path: ${{ steps.pages.outputs.base_path }}"

      - name: Install dependencies
        run: npm ci

      - name: Show source sanity snippets
        run: |
          echo "--- src/main.tsx (1-12)"
          sed -n '1,12p' src/main.tsx
          echo "--- src/App.tsx (1-12)"
          sed -n '1,12p' src/App.tsx
          echo "--- src/widgets/layout/ClientPanel.tsx (108-118)"
          sed -n '108,118p' src/widgets/layout/ClientPanel.tsx
          echo "--- grep checks"
          rg -n "AppShell|setIsEmployee|isEmployee" src/main.tsx src/App.tsx src/widgets/layout/ClientPanel.tsx

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify production HTML entrypoint
        run: |
          if rg -n "src/main\.tsx" dist/index.html; then
            echo "dist/index.html still points to src/main.tsx"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
